worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  ssl_session_timeout 10m;
  ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM';
  ssl_prefer_server_ciphers off;

  server {
    listen 8443 ssl;
    ssl_certificate /run/mgc-tls/server.crt;
    ssl_certificate_key /run/mgc-tls/server.key;
    client_max_body_size 1024m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location / {
      proxy_pass http://auth-proxy:4180;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300s;
    }
  }

  # Dedicated machine-to-machine webhook entry. Client certificates are mandatory.
  server {
    listen 9443 ssl;
    ssl_certificate /run/mgc-tls/server.crt;
    ssl_certificate_key /run/mgc-tls/server.key;
    ssl_client_certificate /run/mgc-tls/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    client_max_body_size 32m;
    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location / {
      proxy_pass http://webhook-edge:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
      proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
