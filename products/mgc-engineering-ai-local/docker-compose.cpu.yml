services:
  model-server:
    image: ${LLAMA_CPP_IMAGE:?Set LLAMA_CPP_IMAGE to an approved pinned llama.cpp server tag or digest}
    pull_policy: never
    command:
      - --model
      - /models/cpu/${CPU_MODEL_FILE:-Qwen3-4B-Q4_K_M.gguf}
      - --alias
      - ${CPU_SERVED_MODEL_NAME:-mgc-local-cpu}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - ${CPU_CONTEXT_SIZE:-8192}
      - --threads
      - ${CPU_THREADS:-8}
      - --threads-batch
      - ${CPU_THREADS_BATCH:-8}
      - --parallel
      - ${CPU_PARALLEL:-1}
      - --gpu-layers
      - "0"
      - --jinja
      - --no-webui
      - --api-key
      - ${LOCAL_MODEL_API_KEY:-local-only}
    volumes:
      - ./models/cpu:/models/cpu:ro
    expose: ["8000"]
    networks: [mgc_internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    user: "65532:65532"
    restart: unless-stopped

  api:
    environment:
      INFERENCE_RUNTIME: cpu
      OMP_NUM_THREADS: ${CPU_AUX_THREADS:-4}
      MKL_NUM_THREADS: ${CPU_AUX_THREADS:-4}
      RERANKER_ENABLED: ${CPU_RERANKER_ENABLED:-true}
      LLM_BASE_URL: http://model-server:8000/v1
      LLM_API_KEY: ${LOCAL_MODEL_API_KEY:-local-only}
      LLM_MODEL: ${CPU_SERVED_MODEL_NAME:-mgc-local-cpu}
      LLM_MAX_TOKENS: ${CPU_LLM_MAX_TOKENS:-800}
      LLM_TIMEOUT_SECONDS: ${CPU_LLM_TIMEOUT_SECONDS:-300}
      # CPU baseline deliberately disables VLM. Vector PDF/OCR/CAD parsing still works.
      VLM_BASE_URL: ""
      VLM_API_KEY: ""
      VLM_MODEL: ""

  worker:
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=cpu-all@%h --concurrency=${CPU_WORKER_CONCURRENCY:-1} -Q interactive,cpu,heavy,default,io,cad,maintenance,background --prefetch-multiplier=1
    environment:
      INFERENCE_RUNTIME: cpu
      OMP_NUM_THREADS: ${CPU_AUX_THREADS:-4}
      MKL_NUM_THREADS: ${CPU_AUX_THREADS:-4}
      RERANKER_ENABLED: ${CPU_RERANKER_ENABLED:-true}
      LLM_BASE_URL: http://model-server:8000/v1
      LLM_API_KEY: ${LOCAL_MODEL_API_KEY:-local-only}
      LLM_MODEL: ${CPU_SERVED_MODEL_NAME:-mgc-local-cpu}
      LLM_MAX_TOKENS: ${CPU_LLM_MAX_TOKENS:-800}
      LLM_TIMEOUT_SECONDS: ${CPU_LLM_TIMEOUT_SECONDS:-300}
      VLM_BASE_URL: ""
      VLM_API_KEY: ""
      VLM_MODEL: ""
