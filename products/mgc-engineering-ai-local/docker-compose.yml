name: mgc-engineering-ai-local

x-offline-env: &offline-env
  AIR_GAPPED_MODE: "true"
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  TOKENIZERS_PARALLELISM: "false"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    pull_policy: never
    environment:
      POSTGRES_DB: mgc
      POSTGRES_USER: mgc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgc-change-me}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgc -d mgc"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [mgc_internal]
    restart: unless-stopped

  qdrant:
    profiles: ["ai", "advanced"]
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    pull_policy: never
    volumes: [qdrant_data:/qdrant/storage]
    networks: [mgc_internal]
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    pull_policy: never
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [mgc_internal]
    restart: unless-stopped

  neo4j:
    profiles: ["advanced"]
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    pull_policy: never
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mgc-graph-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes: [neo4j_data:/data]
    networks: [mgc_internal]
    restart: unless-stopped

  minio:
    profiles: ["advanced"]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mgc}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mgc-minio-change-me}
    volumes: [minio_data:/data]
    networks: [mgc_internal]
    restart: unless-stopped

  model-server:
    profiles: ["ai", "advanced"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    pull_policy: never
    ipc: host
    command:
      - --model
      - /models/generative
      - --served-model-name
      - ${LOCAL_SERVED_MODEL_NAME:-mgc-local}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --generation-config
      - vllm
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
      - --api-key
      - ${LOCAL_MODEL_API_KEY:-local-only}
    environment:
      <<: *offline-env
    volumes:
      - ./models/generative:/models/generative:ro
    expose: ["8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    networks: [mgc_internal]
    restart: unless-stopped

  api:
    image: ${MGC_API_IMAGE:-mgc-engineering-ai-api:${MGC_VERSION:-6.3.34}-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-core}
    pull_policy: never
    env_file:
      - path: .env
        required: false
    environment:
      <<: *offline-env
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-core}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mgc:${POSTGRES_PASSWORD:-mgc-change-me}@postgres:5432/mgc}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mgc-graph-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mgc}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mgc-minio-change-me}
      STORAGE_DIR: /data/storage
      INBOX_DIR: /data/inbox
      MODELS_ROOT: /models
      DOCLING_ARTIFACTS_PATH: /models/docling
      EMBEDDING_MODEL: /models/embeddings
      RERANKER_MODEL: /models/reranker
      RERANKER_ENABLED: "true"
      LLM_BASE_URL: http://model-server:8000/v1
      LLM_API_KEY: ${LOCAL_MODEL_API_KEY:-local-only}
      LLM_MODEL: ${LOCAL_SERVED_MODEL_NAME:-mgc-local}
      VLM_BASE_URL: http://model-server:8000/v1
      VLM_API_KEY: ${LOCAL_MODEL_API_KEY:-local-only}
      VLM_MODEL: ${LOCAL_SERVED_MODEL_NAME:-mgc-local}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - ./models:/models:ro
      - ${MGC_STORAGE_PATH:-./storage}:/data/storage
      - ./inbox:/data/inbox:ro
      - ${ENGINEERING_SHARE_PATH:-./inbox}:/integrations/share:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [mgc_internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

  worker:
    image: ${MGC_API_IMAGE:-mgc-engineering-ai-api:${MGC_VERSION:-6.3.34}-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-core}
    pull_policy: never
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=interactive@%h --concurrency=${INTERACTIVE_WORKER_CONCURRENCY:-2} -Q interactive --prefetch-multiplier=1
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    env_file:
      - path: .env
        required: false
    environment:
      <<: *offline-env
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-core}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mgc:${POSTGRES_PASSWORD:-mgc-change-me}@postgres:5432/mgc}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mgc-graph-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mgc}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mgc-minio-change-me}
      STORAGE_DIR: /data/storage
      INBOX_DIR: /data/inbox
      MODELS_ROOT: /models
      DOCLING_ARTIFACTS_PATH: /models/docling
      EMBEDDING_MODEL: /models/embeddings
      RERANKER_MODEL: /models/reranker
      RERANKER_ENABLED: "true"
      LLM_BASE_URL: http://model-server:8000/v1
      LLM_API_KEY: ${LOCAL_MODEL_API_KEY:-local-only}
      LLM_MODEL: ${LOCAL_SERVED_MODEL_NAME:-mgc-local}
      VLM_BASE_URL: http://model-server:8000/v1
      VLM_API_KEY: ${LOCAL_MODEL_API_KEY:-local-only}
      VLM_MODEL: ${LOCAL_SERVED_MODEL_NAME:-mgc-local}
    volumes:
      - ./models:/models:ro
      - ${MGC_STORAGE_PATH:-./storage}:/data/storage
      - ./inbox:/data/inbox:ro
      - ${ENGINEERING_SHARE_PATH:-./inbox}:/integrations/share:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [mgc_internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-10m}
    restart: unless-stopped

  worker-cpu:
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=cpu@%h --concurrency=${CPU_WORKER_CONCURRENCY:-2} -Q cpu,heavy,default --prefetch-multiplier=1

  worker-io:
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=io@%h --concurrency=${IO_WORKER_CONCURRENCY:-2} -Q io,maintenance,background --prefetch-multiplier=1

  worker-cad:
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=cad@%h --concurrency=${CAD_WORKER_CONCURRENCY:-1} -Q cad --prefetch-multiplier=1

  worker-ai:
    profiles: ["ai", "advanced"]
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=ai@%h --concurrency=${AI_WORKER_CONCURRENCY:-1} -Q ai --prefetch-multiplier=1

  beat:
    image: ${MGC_API_IMAGE:-mgc-engineering-ai-api:${MGC_VERSION:-6.3.34}-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-core}
    pull_policy: never
    command: python -m app.workers.singleton_beat
    env_file:
      - path: .env
        required: false
    environment:
      <<: *offline-env
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-core}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mgc:${POSTGRES_PASSWORD:-mgc-change-me}@postgres:5432/mgc}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      INBOX_DIR: /data/inbox
    volumes:
      - ${MGC_STORAGE_PATH:-./storage}:/data/storage
      - ./inbox:/data/inbox:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [mgc_internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: ${SCHEDULER_STOP_GRACE_PERIOD:-2m}
    restart: unless-stopped

  frontend:
    image: ${MGC_FRONTEND_IMAGE:-mgc-engineering-ai-frontend:${MGC_VERSION:-6.3.34}-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_API_KEY: ""
    pull_policy: never
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: [api]
    networks: [mgc_internal]
    restart: unless-stopped

  gateway:
    image: ${MGC_GATEWAY_IMAGE:-mgc-engineering-ai-gateway:${MGC_VERSION:-6.3.34}-local}
    build:
      context: .
      dockerfile: ops/gateway/Dockerfile
    pull_policy: never
    environment:
      API_KEY: ${API_KEY:-change-me}
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-frontend:8080}
      CUTOVER_GENERATION: ${CUTOVER_GENERATION:-stable}
    depends_on: [frontend, api]
    expose: ["8080"]
    networks: [mgc_internal, mgc_edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp", "/etc/nginx/conf.d"]
    restart: unless-stopped

networks:
  mgc_internal:
    internal: true
  mgc_edge:
    driver: bridge

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  neo4j_data:
  minio_data:
