services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: mgc
      POSTGRES_USER: mgc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgc}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgc -d mgc"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mgc-graph-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes: [neo4j_data:/data]
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mgc}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mgc-minio-change-me}
    volumes: [minio_data:/data]
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://mgc:${POSTGRES_PASSWORD:-mgc}@postgres:5432/mgc
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mgc-graph-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mgc}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mgc-minio-change-me}
      STORAGE_DIR: /data/storage
      INBOX_DIR: /data/inbox
    expose: ["8080"]
    volumes:
      - ./storage:/data/storage
      - ./inbox:/data/inbox:ro
      - ${ENGINEERING_SHARE_PATH:-./inbox}:/integrations/share:ro
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
      neo4j: {condition: service_started}
      minio: {condition: service_started}
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=interactive@%h --concurrency=2 -Q interactive --prefetch-multiplier=1
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://mgc:${POSTGRES_PASSWORD:-mgc}@postgres:5432/mgc
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mgc-graph-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mgc}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mgc-minio-change-me}
      STORAGE_DIR: /data/storage
      INBOX_DIR: /data/inbox
    volumes:
      - ./storage:/data/storage
      - ./inbox:/data/inbox:ro
      - ${ENGINEERING_SHARE_PATH:-./inbox}:/integrations/share:ro
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
      neo4j: {condition: service_started}
      minio: {condition: service_started}
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-10m}
    restart: unless-stopped

  worker-cpu:
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=cpu@%h --concurrency=${CPU_WORKER_CONCURRENCY:-2} -Q cpu,heavy,default --prefetch-multiplier=1

  worker-io:
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=io@%h --concurrency=${IO_WORKER_CONCURRENCY:-2} -Q io,maintenance,background --prefetch-multiplier=1

  worker-cad:
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=cad@%h --concurrency=${CAD_WORKER_CONCURRENCY:-1} -Q cad --prefetch-multiplier=1

  worker-ai:
    profiles: ["ai", "advanced"]
    extends:
      service: worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --hostname=ai@%h --concurrency=${AI_WORKER_CONCURRENCY:-1} -Q ai --prefetch-multiplier=1

  beat:
    build: ./backend
    command: python -m app.workers.singleton_beat
    profiles: ["automation"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://mgc:${POSTGRES_PASSWORD:-mgc}@postgres:5432/mgc
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      INBOX_DIR: /data/inbox
    volumes:
      - ./storage:/data/storage
      - ./inbox:/data/inbox:ro
      - ${ENGINEERING_SHARE_PATH:-./inbox}:/integrations/share:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    stop_grace_period: ${SCHEDULER_STOP_GRACE_PERIOD:-2m}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_API_KEY: ""
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: [api]
    restart: unless-stopped

  gateway:
    image: ${MGC_GATEWAY_IMAGE:-mgc-engineering-ai-gateway:${MGC_VERSION:-6.3.34}-local}
    build:
      context: .
      dockerfile: ops/gateway/Dockerfile
    environment:
      API_KEY: ${API_KEY:-change-me}
    depends_on: [frontend, api]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp", "/etc/nginx/conf.d"]
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    profiles: ["observability"]
    ports: ["3001:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:latest}
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  neo4j_data:
  minio_data:
  prometheus_data:
  grafana_data:
