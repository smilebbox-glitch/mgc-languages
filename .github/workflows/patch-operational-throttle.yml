name: Apply reliability throttle patch

on:
  push:
    branches: [tests/automated-verification-v572]
    paths:
      - '.github/workflows/patch-operational-throttle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tests/automated-verification-v572
      - name: Patch first-event throttling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''            last = _OP_EVENT_LAST.get(throttle_key, 0.0)\n            if now_mono - last < throttle_seconds:\n                return\n'''
          new = '''            last = _OP_EVENT_LAST.get(throttle_key)\n            if last is not None and now_mono - last < throttle_seconds:\n                return\n'''
          if old not in s:
              raise SystemExit('expected operational_event throttle block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'fix: persist first throttled operational event'
          git push origin HEAD:tests/automated-verification-v572
