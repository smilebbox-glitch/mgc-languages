name: mgc-languages-v627-adaptive-training

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v627-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v627-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app.py asgi.py mgc mgc_core
      - name: v6.0.26 compatibility
        run: python tests/v626_team_leaderboard_test.py
      - name: v6.0.27 regression
        run: python tests/v627_adaptive_training_test.py
      - name: Runtime route contract
        run: python -c "import asgi, mgc_core.runtime as r; assert asgi.CONTRACT_REPORT.ok; assert r.ADAPTIVE_TRAINING_ROUTER_BINDING_REPORT.ok"
      - name: JavaScript syntax
        run: |
          node --check static/frontend/adaptive_training_v627.js
          node --check static/frontend/boot.js
      - name: UI contract
        run: |
          grep -q "ADAPTIVE TRAINING LOOP · v6.0.27" static/frontend/adaptive_training_v627.js
          grep -q "adaptive_training_v627.js" static/index.html
          grep -q "adaptive-training-v627" static/frontend/boot.js
          python - <<'PY'
          import re
          text = open('static/frontend/boot.js', encoding='utf-8').read()
          match = re.search(r"pilotCandidate: 'v6\.0\.(\d+)'", text)
          assert match and int(match.group(1)) >= 27, text
          PY
