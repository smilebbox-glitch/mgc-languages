name: MGC Languages VM no-AI verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-no-ai-verification.yml'
      - '.env.vm.example'
      - 'docker-compose.lan.yml'
      - 'docker-compose.vm.yml'
      - 'Dockerfile'
      - 'scripts/start-vm.sh'
      - 'scripts/start-vm.ps1'
      - 'START_VM.bat'
      - 'tests/vm_no_ai_deployment_test.py'
      - 'mgc/**'
      - 'mgc_core/**'
      - 'asgi.py'
      - 'static/frontend/boot.js'
      - 'static/frontend/game_world_v630.js'
      - 'static/game_world_v630.css'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vm-no-ai-verification.yml'
      - '.env.vm.example'
      - 'docker-compose.lan.yml'
      - 'docker-compose.vm.yml'
      - 'Dockerfile'
      - 'scripts/start-vm.sh'
      - 'scripts/start-vm.ps1'
      - 'START_VM.bat'
      - 'tests/vm_no_ai_deployment_test.py'
      - 'mgc/**'
      - 'mgc_core/**'
      - 'asgi.py'
      - 'static/frontend/boot.js'
      - 'static/frontend/game_world_v630.js'
      - 'static/game_world_v630.css'

permissions:
  contents: read

jobs:
  vm-no-ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify VM deployment contract
        run: python tests/vm_no_ai_deployment_test.py
      - name: Start CPU-only VM profile
        run: |
          chmod +x scripts/start-vm.sh scripts/entrypoint.sh
          ./scripts/start-vm.sh
      - name: Verify no-server-AI/TTS environment, readiness and gateway isolation
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:8080/health/live
          curl -fsS http://127.0.0.1:8080/health/ready | tee /tmp/vm-ready.json

          APP_CID="$(docker compose --env-file .env.vm -f docker-compose.lan.yml -f docker-compose.vm.yml ps -q app)"
          DB_CID="$(docker compose --env-file .env.vm -f docker-compose.lan.yml -f docker-compose.vm.yml ps -q db)"
          NGINX_CID="$(docker compose --env-file .env.vm -f docker-compose.lan.yml -f docker-compose.vm.yml ps -q nginx)"
          test -n "$APP_CID"
          test -n "$DB_CID"
          test -n "$NGINX_CID"

          ENV_DUMP="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$APP_CID")"
          test "$(printf '%s\n' "$ENV_DUMP" | sed -n 's/^TTS_ENABLED=//p')" = "false"
          test "$(printf '%s\n' "$ENV_DUMP" | sed -n 's/^TTS_DISK_CACHE_ENABLED=//p')" = "false"
          TRUSTED="$(printf '%s\n' "$ENV_DUMP" | sed -n 's/^TRUSTED_HOSTS=//p')"
          test -n "$TRUSTED"
          case "$TRUSTED" in *'*'*) echo "Wildcard trusted host is forbidden in pilot VM: $TRUSTED"; exit 1;; esac
          printf '%s' "$TRUSTED" | grep -q 'localhost'
          printf '%s' "$TRUSTED" | grep -q '127.0.0.1'

          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$NGINX_CID")" = "true"
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$NGINX_CID" | grep -q 'no-new-privileges'
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$NGINX_CID" | grep -q 'ALL'
          CAP_ADD="$(docker inspect --format '{{json .HostConfig.CapAdd}}' "$NGINX_CID")"
          printf '%s' "$CAP_ADD" | grep -q 'CHOWN'
          printf '%s' "$CAP_ADD" | grep -q 'SETGID'
          printf '%s' "$CAP_ADD" | grep -q 'SETUID'
          if printf '%s' "$CAP_ADD" | grep -Eq 'SYS_ADMIN|NET_ADMIN|SYS_PTRACE|DAC_OVERRIDE'; then
            echo "Forbidden gateway capability detected: $CAP_ADD"
            exit 1
          fi

          test -z "$(docker port "$APP_CID")"
          test -z "$(docker port "$DB_CID")"
          docker port "$NGINX_CID" 8080/tcp | grep -q ':8080'
      - name: Verify current pilot metadata and Game World assets
        run: |
          curl -fsS http://127.0.0.1:8080/api/meta > /tmp/meta.json
          curl -fsS http://127.0.0.1:8080/frontend/game_world_v630.js > /dev/null
          curl -fsS http://127.0.0.1:8080/game_world_v630.css > /dev/null
          python - <<'PY'
          import json
          with open('/tmp/meta.json', encoding='utf-8') as fh:
              meta = json.load(fh)
          assert meta.get('version') == '6.0.30', meta
          assert meta.get('title') == 'MGC Languages', meta
          print(meta)
          PY
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file .env.vm -f docker-compose.lan.yml -f docker-compose.vm.yml logs --no-color --tail=220 app db nginx || true
      - name: Stop VM stack
        if: always()
        run: docker compose --env-file .env.vm -f docker-compose.lan.yml -f docker-compose.vm.yml down -v --remove-orphans || true