name: Server and mobile security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Reject tracked secrets and private keys
        run: python scripts/secret_preflight.py
      - name: Verify security primitives
        run: python tests/v574_security_primitives_test.py
      - name: Verify server and mobile security contracts
        run: python tests/server_mobile_security_test.py
      - name: Validate HTTPS gateway and fail-closed server profile
        run: |
          mkdir -p .ci-tls
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout .ci-tls/tls.key \
            -out .ci-tls/tls.crt \
            -days 30 \
            -subj '/CN=mgc-language-ci.example.internal' \
            -addext 'subjectAltName=DNS:mgc-language-ci.example.internal'
          chmod 600 .ci-tls/tls.key
          cat > .ci-secure.env <<'EOF'
          APP_ENV=pilot
          AUTH_MODE=oidc
          REGISTRATION_ENABLED=false
          COOKIE_SECURE=true
          READY_REQUIRE_OIDC=true
          READY_REQUIRE_SECURE_COOKIE=true
          MGC_SERVER_NAME=mgc-language-ci.example.internal
          TRUSTED_HOSTS=mgc-language-ci.example.internal
          CORS_ORIGINS=
          OIDC_DISCOVERY_URL=https://sso.example.invalid/.well-known/openid-configuration
          OIDC_CLIENT_ID=ci-client
          OIDC_CLIENT_SECRET=ci-client-secret-0123456789
          OIDC_ALLOWED_GROUP=mgc-language-users
          OIDC_STATE_SECRET=ci-state-secret-012345678901234567890123456789
          METRICS_TOKEN=ci-metrics-token-0123456789012345
          POSTGRES_PASSWORD=ci-database-password-0123456789
          TLS_CERT_FILE=./.ci-tls/tls.crt
          TLS_KEY_FILE=./.ci-tls/tls.key
          EOF
          python scripts/server_security_preflight.py .ci-secure.env
          docker run --rm \
            --add-host nginx:127.0.0.1 \
            -v "$PWD/deploy/nginx/secure-gateway.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/.ci-tls/tls.crt:/etc/nginx/tls/tls.crt:ro" \
            -v "$PWD/.ci-tls/tls.key:/etc/nginx/tls/tls.key:ro" \
            nginx:1.27-alpine nginx -t
          docker compose --env-file .ci-secure.env \
            -f docker-compose.pilot.yml \
            -f docker-compose.server-edge.yml \
            config > /tmp/mgc-secure-server-compose.yml
          grep -q 'secure-gateway' /tmp/mgc-secure-server-compose.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/mgc-secure-server-compose.yml
          grep -q 'target: /etc/nginx/tls/tls.crt' /tmp/mgc-secure-server-compose.yml
          python - <<'PY'
          import yaml
          with open('/tmp/mgc-secure-server-compose.yml', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          services = data['services']
          nginx_networks = set(services['nginx']['networks'])
          app_networks = set(services['app']['networks'])
          db_networks = set(services['db']['networks'])
          assert 'backend' not in nginx_networks, nginx_networks
          assert 'app-proxy' in nginx_networks, nginx_networks
          assert {'backend', 'app-proxy'} <= app_networks, app_networks
          assert db_networks == {'backend'}, db_networks
          assert data['networks']['backend']['internal'] is True
          assert data['networks']['app-proxy']['internal'] is True
          print('OK: reverse proxy has no Docker route to PostgreSQL network')
          PY
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  https-runtime-chain:
    name: phone HTTPS -> gateway -> app -> PostgreSQL
    needs: security-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify full secure runtime chain
        run: bash scripts/https_runtime_smoke.sh
