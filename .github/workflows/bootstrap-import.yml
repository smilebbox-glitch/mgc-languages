name: Diagnose complete MGC Languages v5.7.1 P transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect exact Base64 transport boundaries
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/p.part*)
          echo "PART_COUNT=${#parts[@]}"
          for part in "${parts[@]}"; do
            echo "--- $part ---"
            python3 -c "import pathlib,sys; d=pathlib.Path(sys.argv[1]).read_bytes(); b=bytes(c for c in d if c in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='); eq=[i for i,c in enumerate(b) if c==61]; print('RAW='+str(len(d))); print('B64_CHARS='+str(len(b))); print('MOD4='+str(len(b)%4)); print('NEWLINES='+str(d.count(b'\\n'))); print('CR='+str(d.count(b'\\r'))); print('EQ_COUNT='+str(len(eq))); print('EQ_POS_HEAD='+repr(eq[:8])); print('HEAD='+repr(b[:32])); print('TAIL='+repr(b[-64:]))" "$part"
          done

          python3 -c "import pathlib,glob; ps=sorted(glob.glob('.bootstrap/p.part*')); d=b''.join(pathlib.Path(p).read_bytes() for p in ps); b=bytes(c for c in d if c in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='); eq=[i for i,c in enumerate(b) if c==61]; print('TOTAL_RAW='+str(len(d))); print('TOTAL_B64_CHARS='+str(len(b))); print('TOTAL_MOD4='+str(len(b)%4)); print('TOTAL_EQ_COUNT='+str(len(eq))); print('TOTAL_EQ_POS_TAIL='+repr(eq[-12:])); print('FINAL_TAIL='+repr(b[-100:]))"
