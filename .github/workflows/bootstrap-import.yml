name: Audit MGC Languages v5.7.1 archive

on:
  push:
    branches:
      - restore-v5.7.1-clean
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit archived baseline
        shell: bash
        run: |
          set -euo pipefail
          archive='.bootstrap/v571.tar.xz'
          checksum_file='.bootstrap/v571.complete'

          test -s "$archive"
          test -s "$checksum_file"

          expected="$(tr -d '\r\n ' < "$checksum_file")"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          echo "EXPECTED_SHA256=$expected"
          echo "ACTUAL_SHA256=$actual"

          echo '--- XZ TEST ---'
          xz -t "$archive"
          echo 'XZ_OK=1'

          echo '--- ARCHIVE LIST ---'
          tar -tJf "$archive" | sed -n '1,250p'

          echo '--- EXTRACTED STRUCTURE ---'
          rm -rf /tmp/mgc-v571-audit
          mkdir -p /tmp/mgc-v571-audit
          tar -xJf "$archive" -C /tmp/mgc-v571-audit
          find /tmp/mgc-v571-audit -maxdepth 4 -type f -printf '%P\n' | sort | sed -n '1,300p'

          echo '--- VERSION HINTS ---'
          grep -RInE 'v?5\.7\.1|version|MGC Languages|mgc-languages' /tmp/mgc-v571-audit \
            --include='README*' --include='package.json' --include='pyproject.toml' \
            --include='docker-compose*.yml' --include='docker-compose*.yaml' \
            --include='*.md' 2>/dev/null | sed -n '1,200p' || true

          if [ "$actual" = "$expected" ]; then
            echo 'CHECKSUM_MATCH=1'
          else
            echo 'CHECKSUM_MATCH=0'
          fi
