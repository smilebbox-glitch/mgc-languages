name: Bootstrap import v5.7.1

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/p.complete'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover a valid v5.7.1 archive
        shell: bash
        run: |
          set -euo pipefail
          expected_archive='8241c96a42a71384a916db9237987db94de788ac2aeafdf26243fc889eaceef5'
          rm -f /tmp/mgc-v571.tar.xz

          # Prefer the exact verified p.* payload when it is complete.
          if compgen -G '.bootstrap/p.part*' >/dev/null; then
            if cat .bootstrap/p.part* | base64 --decode > /tmp/p-candidate.tar.xz 2>/dev/null; then
              got="$(sha256sum /tmp/p-candidate.tar.xz | awk '{print $1}')"
              if [ "$got" = "$expected_archive" ] && xz -t /tmp/p-candidate.tar.xz; then
                mv /tmp/p-candidate.tar.xz /tmp/mgc-v571.tar.xz
                echo 'Using exact verified p payload'
              fi
            fi
          fi

          # Previous staging attempts used different chunk boundaries. An XZ
          # stream has its own integrity check; candidates are accepted only
          # after extraction AND critical-file hashes are verified below.
          if [ ! -s /tmp/mgc-v571.tar.xz ]; then
            for prefix in w q q2 r r2 xz y z release.b64 b; do
              if ! compgen -G ".bootstrap/${prefix}.part*" >/dev/null; then
                continue
              fi
              echo "Trying payload prefix: ${prefix}"
              if ! cat .bootstrap/${prefix}.part* | base64 --decode > /tmp/candidate.tar.xz 2>/dev/null; then
                continue
              fi
              if xz -t /tmp/candidate.tar.xz 2>/dev/null; then
                cp /tmp/candidate.tar.xz /tmp/mgc-v571.tar.xz
                echo "XZ-valid candidate: ${prefix}"
                break
              fi
            done
          fi

          test -s /tmp/mgc-v571.tar.xz || { echo 'No integrity-valid release payload found'; exit 1; }
          xz -t /tmp/mgc-v571.tar.xz
          rm -rf /tmp/mgc-v571
          mkdir -p /tmp/mgc-v571
          tar -xJf /tmp/mgc-v571.tar.xz -C /tmp/mgc-v571

      - name: Verify extracted v5.7.1 critical files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mgc-v571
          test -f app.py
          test -f static/app.js
          test -f static/index.html
          test -f data/chinese.json
          test -f requirements.txt
          test -f RELEASE_VERIFICATION_v5.7.1.txt
          test -f .github/workflows/ci.yml
          echo '693adc9a53314e798e05a44b33be1470c7f6d2cf55d1f6fd98307309e4f27dc4  app.py' | sha256sum -c -
          echo '3487bb75b547f473c29d35a329aae7a033df8e5062343b0031822702d411de7f  static/app.js' | sha256sum -c -
          echo 'a79fc452a435d6427015e9a06129e999244acf9dca90f2975988ab119d656444  static/index.html' | sha256sum -c -
          echo '1b1e23fa79676bb1017d746d45d0638498bc96a5e1bcba26167590de36c4d221  data/chinese.json' | sha256sum -c -
          echo '74b3380fe50afc6d21d3fea8ade4ab442c6fa19050e5b9949c86e185645ec2b9  requirements.txt' | sha256sum -c -
          echo 'ebbbcd4655c598970f18d477612e6164929bdfc8afb88202497c9881fbc5456f  RELEASE_VERIFICATION_v5.7.1.txt' | sha256sum -c -
          echo '0c44ba470ec81fd76cea40c4631a28fd7a816a15702595b5cb6695fbbf109c2a  .github/workflows/ci.yml' | sha256sum -c -
          grep -q 'MGC Languages v5.7.1' RELEASE_VERIFICATION_v5.7.1.txt
          grep -q 'c57d0a31f570' RELEASE_VERIFICATION_v5.7.1.txt

      - name: Import repository contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            /tmp/mgc-v571/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore: import MGC Languages v5.7.1 baseline'
          git push origin HEAD:main
