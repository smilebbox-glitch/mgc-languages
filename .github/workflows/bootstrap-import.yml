name: Restore MGC Languages v5.7.1 clean baseline

on:
  push:
    branches:
      - restore-v5.7.1-clean
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archived baseline
        shell: bash
        run: |
          set -euo pipefail
          archive='.bootstrap/v571.tar.xz'
          checksum_file='.bootstrap/v571.complete'

          test -s "$archive"
          test -s "$checksum_file"

          expected="$(tr -d '\r\n ' < "$checksum_file")"
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          xz -t "$archive"

      - name: Extract archived baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mgc-v571
          mkdir -p /tmp/mgc-v571
          tar -xJf .bootstrap/v571.tar.xz -C /tmp/mgc-v571

          source_dir='/tmp/mgc-v571'
          shopt -s dotglob nullglob
          entries=("$source_dir"/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_dir="${entries[0]}"
          fi

          test -d "$source_dir"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Replace bootstrap repository with verified source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            "$SOURCE_DIR"/ ./

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit restored v5.7.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi

          git commit -m 'chore: restore verified MGC Languages v5.7.1 baseline'
          git push origin HEAD:restore-v5.7.1-clean
