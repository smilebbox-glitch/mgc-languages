name: Audit reconstructed MGC Languages v5.7.1 baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and audit baseline from bootstrap parts
        shell: bash
        run: |
          set -euo pipefail
          expected='8241c96a42a71384a916db9237987db94de788ac2aeafdf26243fc889eaceef5'
          archive='/tmp/mgc-v571-reconstructed.tar.xz'

          shopt -s nullglob
          parts=(.bootstrap/p.part*)
          echo "PART_COUNT=${#parts[@]}"
          test "${#parts[@]}" -gt 0
          printf 'PART=%s\n' "${parts[@]}"

          cat "${parts[@]}" | base64 --decode > "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          echo "EXPECTED_SHA256=$expected"
          echo "ACTUAL_SHA256=$actual"
          test "$actual" = "$expected"

          xz -t "$archive"
          echo 'XZ_OK=1'

          rm -rf /tmp/mgc-v571-audit
          mkdir -p /tmp/mgc-v571-audit
          tar -xJf "$archive" -C /tmp/mgc-v571-audit

          echo '--- ARCHIVE STRUCTURE ---'
          find /tmp/mgc-v571-audit -maxdepth 4 -type f -printf '%P\n' | sort | sed -n '1,350p'

          echo '--- VERSION HINTS ---'
          grep -RInE 'v?5\.7\.1|version|MGC Languages|mgc-languages|Putonghua|путунхуа' /tmp/mgc-v571-audit \
            --include='README*' --include='package.json' --include='pyproject.toml' \
            --include='docker-compose*.yml' --include='docker-compose*.yaml' \
            --include='*.md' 2>/dev/null | sed -n '1,250p' || true

          echo 'RECONSTRUCTED_BASELINE_OK=1'
