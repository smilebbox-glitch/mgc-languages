name: Bootstrap import v5.7.1

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/r.complete'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/r.part* | base64 --decode > /tmp/mgc-v571.tar.xz
          echo "444697a40fbed944f6ccd02ad2fbaed4d7c0c3e894682089b6ca19fe98e6dd71  /tmp/mgc-v571.tar.xz" | sha256sum -c -
          xz -t /tmp/mgc-v571.tar.xz
          mkdir -p /tmp/mgc-v571
          tar -xJf /tmp/mgc-v571.tar.xz -C /tmp/mgc-v571
      - name: Import repository contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            /tmp/mgc-v571/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore: import MGC Languages v5.7.1 baseline'
          git push origin HEAD:main
