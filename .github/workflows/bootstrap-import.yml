name: Bootstrap import v5.7.1

on:
  push:
    paths:
      - '.bootstrap/v571.complete'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v571.part* | base64 --decode > /tmp/mgc-v571.zip
          echo "fffbb88fa50ec555e94331fd605fc529447178d6d19efb53971ba442d83f7297  /tmp/mgc-v571.zip" | sha256sum -c -
          mkdir -p /tmp/mgc-v571
          unzip -q /tmp/mgc-v571.zip -d /tmp/mgc-v571
      - name: Import repository contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            /tmp/mgc-v571/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore: import MGC Languages v5.7.1 baseline'
          git push origin HEAD:main
