name: Verify repaired MGC Languages v5.7.1 baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repaired canonical P archive
        shell: bash
        run: |
          set -euo pipefail
          expected='8241c96a42a71384a916db9237987db94de788ac2aeafdf26243fc889eaceef5'
          encoded='/tmp/mgc-v571-p.b64'
          archive='/tmp/mgc-v571-p.tar.xz'

          shopt -s nullglob
          parts=(.bootstrap/p.part*)
          echo "PART_COUNT=${#parts[@]}"
          test "${#parts[@]}" -eq 6
          printf 'PART=%s\n' "${parts[@]}"

          cat "${parts[@]}" > "$encoded"
          base64 --decode "$encoded" > "$archive"

          actual="$(sha256sum "$archive" | awk '{print $1}')"
          echo "EXPECTED_SHA256=$expected"
          echo "ACTUAL_SHA256=$actual"
          test "$actual" = "$expected"

          xz -t "$archive"
          echo 'XZ_OK=1'

          rm -rf /tmp/mgc-v571-verified
          mkdir -p /tmp/mgc-v571-verified
          tar -xJf "$archive" -C /tmp/mgc-v571-verified
          echo 'TAR_OK=1'
          echo "FILE_COUNT=$(find /tmp/mgc-v571-verified -type f | wc -l)"

          echo '--- SOURCE TREE ---'
          find /tmp/mgc-v571-verified -maxdepth 5 -type f -printf '%P\n' | sort | sed -n '1,400p'

          echo 'P_BASELINE_VERIFIED=1'
