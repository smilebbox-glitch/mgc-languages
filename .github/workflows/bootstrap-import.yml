name: Bootstrap import v5.7.1

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/v571.complete'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract release archive
        shell: bash
        run: |
          set -euo pipefail
          echo "ef921e9b06be0eea85e58b10b689d1f3c9a1c79b9ff1fc95332d5fb12cdb2b26  .bootstrap/v571.tar.xz" | sha256sum -c -
          mkdir -p /tmp/mgc-v571
          tar -xJf .bootstrap/v571.tar.xz -C /tmp/mgc-v571
      - name: Import repository contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            /tmp/mgc-v571/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore: import MGC Languages v5.7.1 baseline'
          git push origin HEAD:main
