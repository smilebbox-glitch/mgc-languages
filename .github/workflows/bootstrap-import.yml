name: Audit W backup for MGC Languages v5.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and inspect W backup
        shell: bash
        run: |
          set -euo pipefail
          archive='/tmp/mgc-v571-w.tar.xz'
          encoded='/tmp/mgc-v571-w.b64'

          shopt -s nullglob
          parts=(.bootstrap/w.part*)
          echo "PART_COUNT=${#parts[@]}"
          test "${#parts[@]}" -gt 0
          printf 'PART=%s\n' "${parts[@]}"

          cat "${parts[@]}" > "$encoded"
          encoded_bytes="$(wc -c < "$encoded")"
          echo "ENCODED_BYTES=$encoded_bytes"
          test $((encoded_bytes % 4)) -eq 0

          base64 --decode "$encoded" > "$archive"
          echo "ARCHIVE_BYTES=$(wc -c < "$archive")"
          echo "ARCHIVE_SHA256=$(sha256sum "$archive" | awk '{print $1}')"

          xz -t "$archive"
          echo 'XZ_OK=1'

          rm -rf /tmp/mgc-v571-w-audit
          mkdir -p /tmp/mgc-v571-w-audit
          tar -xJf "$archive" -C /tmp/mgc-v571-w-audit
          echo 'TAR_OK=1'

          echo '--- FILE COUNT ---'
          find /tmp/mgc-v571-w-audit -type f | wc -l

          echo '--- ARCHIVE STRUCTURE ---'
          find /tmp/mgc-v571-w-audit -maxdepth 5 -type f -printf '%P\n' | sort | sed -n '1,400p'

          echo '--- VERSION / PRODUCT HINTS ---'
          grep -RInE 'v?5\.7\.1|MGC Languages|mgc-languages|Putonghua|путунхуа|docker|version' /tmp/mgc-v571-w-audit \
            --include='README*' --include='package.json' --include='pyproject.toml' \
            --include='docker-compose*.yml' --include='docker-compose*.yaml' \
            --include='*.md' 2>/dev/null | sed -n '1,300p' || true

          echo 'W_BACKUP_VALID=1'
