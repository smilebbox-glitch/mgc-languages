name: Cross-check MGC Languages v5.7.1 bootstrap streams

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare P stream against independent Q stream
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import glob,pathlib; norm=lambda p: bytes(c for c in pathlib.Path(p).read_bytes() if c in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='); ps=sorted(glob.glob('.bootstrap/p.part*')); qs=sorted(glob.glob('.bootstrap/q.part*')); P=b''.join(norm(p) for p in ps); Q=b''.join(norm(q) for q in qs); n=min(len(P),len(Q)); mismatch=next((i for i in range(n) if P[i]!=Q[i]),None); print('P_PARTS='+repr(ps)); print('Q_PARTS='+repr(qs)); print('P_CHARS='+str(len(P))); print('Q_CHARS='+str(len(Q))); print('COMMON_COMPARE='+str(n)); print('FIRST_MISMATCH='+repr(mismatch)); print('COMMON_PREFIX='+str(n if mismatch is None else mismatch)); [print('P_HEAD_OFFSET '+p+' '+str(P.find(norm(p)[:64]))) for p in ps]; [print('Q_HEAD_OFFSET '+q+' '+str(Q.find(norm(q)[:64]))) for q in qs]; print('P_AROUND='+repr(P[max(0,(mismatch or 0)-40):(mismatch or 0)+80]) if mismatch is not None else 'P_AROUND=None'); print('Q_AROUND='+repr(Q[max(0,(mismatch or 0)-40):(mismatch or 0)+80]) if mismatch is not None else 'Q_AROUND=None')"
