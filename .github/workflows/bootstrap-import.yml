name: Restore verified MGC Languages v5.7.1 from Library release

on:
  push:
    branches:
      - restore-v5.7.1-original-library
    paths:
      - '.bootstrap/library-v571.complete'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify original Library ZIP
        shell: bash
        run: |
          set -euo pipefail
          expected='6c520665bfd9151a77b52b9a129b18a4c2ae54027983249d618aed6f8a5c9de7'
          cat .bootstrap/library-v571.part* | base64 --decode > /tmp/MGC_Languages_v5.7.1_Observability_Recovery.zip
          actual="$(sha256sum /tmp/MGC_Languages_v5.7.1_Observability_Recovery.zip | awk '{print $1}')"
          echo "EXPECTED_SHA256=$expected"
          echo "ACTUAL_SHA256=$actual"
          test "$actual" = "$expected"
          unzip -t /tmp/MGC_Languages_v5.7.1_Observability_Recovery.zip

      - name: Extract verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mgc-v571-library
          mkdir -p /tmp/mgc-v571-library
          unzip -q /tmp/MGC_Languages_v5.7.1_Observability_Recovery.zip -d /tmp/mgc-v571-library
          source_dir='/tmp/mgc-v571-library/MGC_Languages_v5.7.1_Observability_Recovery'
          test -f "$source_dir/app.py"
          test -f "$source_dir/BUILD_INFO_v5.7.1.txt"
          test -f "$source_dir/RELEASE_VERIFICATION_v5.7.1.txt"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Replace bootstrap tree with verified source release
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$SOURCE_DIR"/ ./
          test -f app.py
          test -f BUILD_INFO_v5.7.1.txt

      - name: Commit clean v5.7.1 source baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: restore verified MGC Languages v5.7.1 Library baseline'
          git push origin HEAD:restore-v5.7.1-original-library
