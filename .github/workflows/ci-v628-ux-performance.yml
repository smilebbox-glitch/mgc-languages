name: mgc-languages-v628-ux-performance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v628-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v628-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: v6.0.27 compatibility
        run: python tests/v627_adaptive_training_test.py
      - name: v6.0.28 regression
        run: python tests/v628_ux_performance_test.py
      - name: JavaScript syntax
        run: |
          node --check static/frontend/pilot_ux_hardening.js
          node --check static/frontend/ux_performance_v628.js
          node --check static/frontend/boot.js
      - name: Accessibility and performance contract
        run: |
          grep -q 'v628-skip-link' static/index.html
          grep -q "frontend.register('ux-performance-v628'" static/frontend/ux_performance_v628.js
          grep -q 'prefers-reduced-motion:reduce' static/ux_performance_v628.css
          grep -q 'content-visibility:auto' static/ux_performance_v628.css
          grep -q "pilotCandidate: 'v6.0." static/frontend/boot.js
