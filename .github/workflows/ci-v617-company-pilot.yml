name: mgc-languages-v617-company-pilot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v617-${{ github.ref }}
  cancel-in-progress: true

jobs:
  company-pilot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Previous shell + pilot candidate contracts
        run: |
          python tests/v616_frontend_physical_shell_cleanup_test.py
          python tests/v617_company_pilot_candidate_test.py

      - name: User-review UX regression
        run: python tests/v617_pilot_ux_regression_test.py

      - name: v6.0.18 vocabulary and games regression
        run: python tests/v618_content_games_regression_test.py

      - name: v6.0.19 Factory Journey regression
        run: python tests/v619_factory_journey_test.py

      - name: v6.0.20 adaptive arcade missions regression
        run: python tests/v620_arcade_missions_test.py

      - name: v6.0.20 arcade mastery regression
        run: python tests/v620_arcade_mastery_test.py

      - name: v6.0.21 production game depth regression
        run: python tests/v621_game_depth_test.py

      - name: v6.0.22 production decision chains regression
        run: python tests/v622_decision_chains_test.py

      - name: JavaScript syntax
        run: |
          node --check static/frontend/pilot_home.js
          node --check static/frontend/pilot_ux_hardening.js
          node --check static/frontend/learning.js
          node --check static/frontend/game_lab_v618.js
          node --check static/frontend/game_engagement_v618.js
          node --check static/frontend/factory_journey_v619.js
          node --check static/frontend/arcade_missions_v620.js
          node --check static/frontend/arcade_mastery_v620.js
          node --check static/frontend/game_depth_v621.js
          node --check static/frontend/decision_chains_v622.js
          node --check static/frontend/practice_games.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js

      - name: Corporate configuration preflight contract
        run: |
          cat > .env.ci-pilot <<'EOF'
          POSTGRES_PASSWORD=ci-strong-db-password
          OIDC_STATE_SECRET=ci-state-secret-32-bytes-minimum-value
          METRICS_TOKEN=ci-metrics-token-value
          REGISTRATION_ENABLED=false
          READY_REQUIRE_SCHEMA_HEAD=true
          READY_REQUIRE_RLS=true
          READY_REQUIRE_TERM_APPROVAL=true
          TRUSTED_HOSTS=mgc-pilot.internal
          AUTH_MODE=oidc
          COOKIE_SECURE=true
          READY_REQUIRE_OIDC=true
          READY_REQUIRE_SECURE_COOKIE=true
          OIDC_DISCOVERY_URL=https://sso.invalid/.well-known/openid-configuration
          OIDC_CLIENT_ID=ci-client
          OIDC_CLIENT_SECRET=ci-secret
          EOF
          python scripts/company_pilot_preflight.py --env-file .env.ci-pilot --strict-corporate

      - name: Approved UI parity guard
        run: |
          grep -q "frontend.register('pilot-home'" static/frontend/pilot_home.js
          grep -q "Китайский язык для автопрома" static/frontend/pilot_home.js
          grep -q "English for the automotive industry" static/frontend/pilot_home.js
          grep -q "function dailyPhrase(language, date)" static/frontend/pilot_home.js
          grep -q "scheduleMidnightRefresh" static/frontend/pilot_home.js
          grep -q "Информация о китайском" static/index.html
          grep -q "game_lab_v618.js" static/index.html
          grep -q "factory_journey_v619.js" static/index.html
          grep -q "arcade_missions_v620.js" static/index.html
          grep -q "arcade_mastery_v620.js" static/index.html
          grep -q "game_depth_v621.js" static/index.html
          grep -q "decision_chains_v622.js" static/index.html
          grep -q "MGC AUTOMOTIVE ARCADE · 20 ИГР" static/frontend/game_lab_v618.js
          grep -q "Пройдите автомобиль через весь завод" static/frontend/factory_journey_v619.js
          grep -q "Три короткие миссии на сегодня" static/frontend/arcade_missions_v620.js
          grep -q "Карта навыков по вашей игровой практике" static/frontend/arcade_mastery_v620.js
          grep -q "Тренировать слабое место" static/frontend/arcade_mastery_v620.js
          grep -q "PRODUCTION DIFFICULTY" static/frontend/game_depth_v621.js
          grep -q "PAINT BOOTH" static/frontend/game_depth_v621.js
          grep -q "BODY SHOP" static/frontend/game_depth_v621.js
          grep -q "RECEIVING" static/frontend/game_depth_v621.js
          grep -q "PRODUCTION DECISION CHAIN" static/frontend/decision_chains_v622.js
          grep -q "Quality Escalation" static/frontend/decision_chains_v622.js
          grep -q "Supplier Escalation" static/frontend/decision_chains_v622.js
          ! grep -q "About English" static/index.html
          ! grep -q "Сценарий смены" static/frontend/pilot_home.js
          ! grep -q "Новая сегодня" static/frontend/pilot_home.js

      - name: Pilot artwork is local/offline
        run: |
          test -f static/pilot/hero-chinese.svg
          test -f static/pilot/hero-english.svg
          for i in 1 2 3 4 5 6 7; do test -f "static/pilot/phrase-${i}.svg"; done
          for f in assembly welding paint stamping quality logistics; do test -f "static/pilot/topics/${f}.svg"; done
