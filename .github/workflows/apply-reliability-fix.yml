name: Apply reliability telemetry fix

on:
  push:
    branches: [tests/automated-verification]
    paths:
      - '.github/workflows/apply-reliability-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tests/automated-verification
      - name: Patch first-event throttling semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          old = '''            last = _OP_EVENT_LAST.get(throttle_key, 0.0)\n            if now_mono - last < throttle_seconds:\n                return\n            _OP_EVENT_LAST[throttle_key] = now_mono\n'''
          new = '''            last = _OP_EVENT_LAST.get(throttle_key)\n            if last is not None and now_mono - last < throttle_seconds:\n                return\n            _OP_EVENT_LAST[throttle_key] = now_mono\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one throttle block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- app.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'fix: do not throttle the first operational event'
          git push origin HEAD:tests/automated-verification
