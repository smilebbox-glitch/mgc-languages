name: mgc-languages-v631-vm-deployment-kit

on:
  push:
    branches: [main]
    paths:
      - 'VM_IT_DIRECTOR.md'
      - '.env.vm.example'
      - 'docker-compose.vm.prod.yml'
      - 'deploy/vm/**'
      - 'deploy/nginx/vm-https.conf'
      - 'tests/v631_vm_deployment_kit_test.py'
      - 'tests/v631_3d_cold_start_deployment_test.py'
      - '.github/workflows/ci-v631-vm-deployment-kit.yml'
  pull_request:
    paths:
      - 'VM_IT_DIRECTOR.md'
      - '.env.vm.example'
      - 'docker-compose.vm.prod.yml'
      - 'deploy/vm/**'
      - 'deploy/nginx/vm-https.conf'
      - 'tests/v631_vm_deployment_kit_test.py'
      - 'tests/v631_3d_cold_start_deployment_test.py'
      - '.github/workflows/ci-v631-vm-deployment-kit.yml'
  workflow_dispatch:

concurrency:
  group: vm-deployment-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-kit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: VM kit static regression
        run: |
          python tests/v631_vm_deployment_kit_test.py
          python tests/v631_3d_cold_start_deployment_test.py

      - name: Shell syntax
        run: bash -n deploy/vm/*.sh

      - name: Prepare disposable VM configuration and TLS
        shell: bash
        run: |
          cp .env.vm.example .env.vm.ci
          sed -i 's/CHANGE_ME_VM_IP_OR_DNS/127.0.0.1/g' .env.vm.ci
          sed -i 's/CHANGE_ME_DB_PASSWORD/ci_db_secret_97eca3d0/g' .env.vm.ci
          sed -i 's/CHANGE_ME_OIDC_SECRET/ci_oidc_secret_97eca3d0/g' .env.vm.ci
          sed -i 's/CHANGE_ME_ADMIN_PASSWORD/ci_admin_secret_97eca3d0/g' .env.vm.ci
          sed -i 's/CHANGE_ME_METRICS_TOKEN/ci_metrics_secret_97eca3d0/g' .env.vm.ci
          sed -i 's/^MGC_HTTPS_PORT=.*/MGC_HTTPS_PORT=18443/' .env.vm.ci
          mkdir -p deploy/vm/runtime/certs
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 \
            -keyout deploy/vm/runtime/certs/server.key \
            -out deploy/vm/runtime/certs/server.crt \
            -days 2 -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 deploy/vm/runtime/certs/server.key

      - name: Validate production VM compose
        run: docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml config --quiet

      - name: Start production VM stack
        run: docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml up -d --build

      - name: Wait for HTTPS readiness
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -kfsS https://127.0.0.1:18443/health/ready > /tmp/vm-ready.json; then
              cat /tmp/vm-ready.json
              exit 0
            fi
            if docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml ps --status exited --services | grep -Eq '^(app|nginx|db)$'; then
              docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml logs --no-color --tail 200 app nginx db
              exit 1
            fi
            sleep 2
          done
          echo 'VM stack did not become ready in time.'
          exit 1

      - name: Verify HTTPS web/PWA and protected runtime
        shell: bash
        run: |
          curl -kfsS https://127.0.0.1:18443/health/live > /tmp/vm-live.json
          curl -kfsS https://127.0.0.1:18443/api/meta > /tmp/vm-meta.json
          curl -kfsS https://127.0.0.1:18443/ > /tmp/vm-index.html
          grep -q '/frontend/boot.js' /tmp/vm-index.html
          curl -kfsS https://127.0.0.1:18443/manifest.webmanifest > /tmp/vm-manifest.json
          docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          test -z "$(docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml port db 5432 2>/dev/null || true)"
          test -z "$(docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml port app 8000 2>/dev/null || true)"
          for endpoint in /api/adaptive-training/plan /api/manager/shift-analytics; do
            status="$(curl -ksS -o /dev/null -w '%{http_code}' "https://127.0.0.1:18443${endpoint}")"
            case "$status" in
              401|403) ;;
              *) echo "Protected endpoint ${endpoint} returned ${status}"; exit 1 ;;
            esac
          done

      - name: Browser-like cold-start asset burst
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import re
          import ssl
          import urllib.error
          import urllib.request

          base = "https://127.0.0.1:18443"
          ctx = ssl._create_unverified_context()
          with urllib.request.urlopen(base + "/", context=ctx, timeout=10) as response:
              html = response.read().decode("utf-8")
          paths = set(re.findall(r'(?:src|href)="(/[^"#?]+)', html))
          paths.update({
              "/production_motion_v630.css",
              "/factory_process_simulator_v630.css",
              "/factory_simulator_stage2_v630.css",
              "/factory_training_intelligence_v631.css",
              "/frontend/production_motion_v630.js",
              "/frontend/factory_process_simulator_v630.js",
              "/frontend/factory_simulator_stage2_v630.js",
              "/frontend/factory_training_intelligence_v631.js",
              "/frontend/digital_vehicle_3d_v630.js",
              "/frontend/digital_truck_3d_v630.js",
              "/frontend/assembly_builder_v630.js",
              "/frontend/powertrain_builder_v630.js",
              "/frontend/factory_digital_thread_v630.js",
          })
          paths = sorted(p for p in paths if not p.startswith("/api/"))
          assert len(paths) > 72, f"cold-start regression needs >72 assets, got {len(paths)}"

          def fetch(path):
              req = urllib.request.Request(base + path, headers={"User-Agent": "MGC-Cold-Start-Smoke/1.0"})
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as response:
                      body = response.read(128)
                      return path, response.status, len(body)
              except urllib.error.HTTPError as exc:
                  return path, exc.code, 0
              except Exception as exc:
                  return path, type(exc).__name__, 0

          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as pool:
              results = list(pool.map(fetch, paths))
          bad = [item for item in results if item[1] != 200]
          if bad:
              print("Cold-start asset failures:", bad)
              raise SystemExit(1)
          print(f"PASS: {len(results)} browser-like startup assets returned HTTP 200 with no throttled 3D modules")
          PY

      - name: VM runtime diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml ps -a || true
          docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml logs --no-color --tail 250 app nginx db || true

      - name: Stop disposable VM stack
        if: always()
        run: docker compose --env-file .env.vm.ci -f docker-compose.vm.prod.yml down -v --remove-orphans || true
