name: mgc-languages-v630-art-direction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v630-art-direction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  art-direction-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Art Direction / Executive Showcase regression
        run: python tests/v630_art_direction_showcase_test.py

      - name: Art Direction Scene Realism regression
        run: python tests/v630_art_direction_scene_realism_test.py

      - name: Digital Vehicle 3D regression
        run: python tests/v630_digital_vehicle_3d_test.py

      - name: Digital Truck 3D regression
        run: python tests/v630_digital_truck_3d_test.py

      - name: Assembly Builder 3D regression
        run: python tests/v630_assembly_builder_test.py

      - name: Powertrain + Assembly Operations regression
        run: python tests/v630_powertrain_operations_test.py

      - name: Animation & Interaction Stage regression
        run: python tests/v630_animation_interaction_test.py

      - name: Factory Digital Production Thread regression
        run: python tests/v630_factory_digital_thread_test.py

      - name: Production Motion Stage regression
        run: python tests/v630_production_motion_test.py

      - name: Factory Process Simulator regression
        run: python tests/v630_factory_process_simulator_test.py

      - name: Factory Simulator Stage 2 regression
        run: python tests/v630_factory_simulator_stage2_test.py

      - name: Factory Training Intelligence regression
        run: python tests/v631_factory_training_intelligence_test.py

      - name: PWA + Mobile Experience regression
        run: python tests/v631_mobile_pwa_experience_test.py

      - name: Executive visual base regression
        run: python tests/v630_executive_visual_test.py

      - name: Executive polish Stage 2 regression
        run: python tests/v630_executive_polish_test.py

      - name: Russian UI + Chinese learning-content regression
        run: python tests/v630_chinese_learning_surface_test.py

      - name: JavaScript syntax
        run: |
          node --check static/frontend/art_direction_v630.js
          node --check static/frontend/art_direction_scenes_v630.js
          node --check static/frontend/digital_vehicle_3d_v630.js
          node --check static/frontend/digital_truck_3d_v630.js
          node --check static/frontend/assembly_builder_v630.js
          node --check static/frontend/assembly_builder_language_feedback_v630.js
          node --check static/frontend/assembly_operations_v630.js
          node --check static/frontend/powertrain_builder_v630.js
          node --check static/frontend/animation_interaction_v630.js
          node --check static/frontend/factory_digital_thread_v630.js
          node --check static/frontend/production_motion_v630.js
          node --check static/frontend/factory_process_simulator_v630.js
          node --check static/frontend/factory_simulator_stage2_v630.js
          node --check static/frontend/factory_training_intelligence_v631.js
          node --check static/frontend/mobile_experience_v631.js
          node --check static/pwa-register.js
          node --check static/service-worker.js
          node --check static/frontend/boot.js

      - name: Current release guard
        run: python scripts/release_candidate_guard.py --json

      - name: PWA security isolation
        run: python tests/pwa_security_test.py
