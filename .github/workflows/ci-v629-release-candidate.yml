name: mgc-languages-v629-archive-contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v629-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v629-archive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: v6.0.29 archived RC1 baseline
        run: python tests/v629_release_candidate_test.py

      - name: v6.0.29 archived operability baseline
        run: python tests/v629_operability_smoke_test.py

      - name: Archived manifest identity
        run: |
          grep -q '"release": "6.0.29"' RELEASE_MANIFEST_v6.0.29.json
          grep -q '"candidate": "RC1"' RELEASE_MANIFEST_v6.0.29.json
          grep -q '"status": "pilot-freeze"' RELEASE_MANIFEST_v6.0.29.json
          grep -q 'Release: v6.0.29' BUILD_INFO_v6.0.29.txt
