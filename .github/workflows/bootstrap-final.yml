name: Final verified v5.7.1 import

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/final-import.trigger'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate verified v5.7.1 tree in repository history
        shell: bash
        run: |
          set -euo pipefail
          expected_app='693adc9a53314e798e05a44b33be1470c7f6d2cf55d1f6fd98307309e4f27dc4'
          expected_js='3487bb75b547f473c29d35a329aae7a033df8e5062343b0031822702d411de7f'
          expected_html='a79fc452a435d6427015e9a06129e999244acf9dca90f2975988ab119d656444'
          expected_cn='1b1e23fa79676bb1017d746d45d0638498bc96a5e1bcba26167590de36c4d221'
          expected_req='74b3380fe50afc6d21d3fea8ade4ab442c6fa19050e5b9949c86e185645ec2b9'

          verified_commit=''
          while read -r commit; do
            git cat-file -e "${commit}:app.py" 2>/dev/null || continue
            git cat-file -e "${commit}:static/app.js" 2>/dev/null || continue
            git cat-file -e "${commit}:static/index.html" 2>/dev/null || continue
            git cat-file -e "${commit}:data/chinese.json" 2>/dev/null || continue
            git cat-file -e "${commit}:requirements.txt" 2>/dev/null || continue
            git cat-file -e "${commit}:RELEASE_VERIFICATION_v5.7.1.txt" 2>/dev/null || continue

            app_hash="$(git show "${commit}:app.py" | sha256sum | awk '{print $1}')"
            [[ "$app_hash" == "$expected_app" ]] || continue
            js_hash="$(git show "${commit}:static/app.js" | sha256sum | awk '{print $1}')"
            [[ "$js_hash" == "$expected_js" ]] || continue
            html_hash="$(git show "${commit}:static/index.html" | sha256sum | awk '{print $1}')"
            [[ "$html_hash" == "$expected_html" ]] || continue
            cn_hash="$(git show "${commit}:data/chinese.json" | sha256sum | awk '{print $1}')"
            [[ "$cn_hash" == "$expected_cn" ]] || continue
            req_hash="$(git show "${commit}:requirements.txt" | sha256sum | awk '{print $1}')"
            [[ "$req_hash" == "$expected_req" ]] || continue
            git show "${commit}:RELEASE_VERIFICATION_v5.7.1.txt" | grep -q 'MGC Languages v5.7.1' || continue
            git show "${commit}:RELEASE_VERIFICATION_v5.7.1.txt" | grep -q 'c57d0a31f570' || continue

            verified_commit="$commit"
            break
          done < <(git rev-list --all --date-order)

          if [[ -z "$verified_commit" ]]; then
            echo 'ERROR: no Git commit contains the fully verified MGC Languages v5.7.1 tree.' >&2
            exit 1
          fi

          echo "Verified source commit: $verified_commit"
          rm -rf /tmp/mgc-v571
          mkdir -p /tmp/mgc-v571
          git archive "$verified_commit" | tar -x -C /tmp/mgc-v571

      - name: Verify extracted critical files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mgc-v571
          echo '693adc9a53314e798e05a44b33be1470c7f6d2cf55d1f6fd98307309e4f27dc4  app.py' | sha256sum -c -
          echo '3487bb75b547f473c29d35a329aae7a033df8e5062343b0031822702d411de7f  static/app.js' | sha256sum -c -
          echo 'a79fc452a435d6427015e9a06129e999244acf9dca90f2975988ab119d656444  static/index.html' | sha256sum -c -
          echo '1b1e23fa79676bb1017d746d45d0638498bc96a5e1bcba26167590de36c4d221  data/chinese.json' | sha256sum -c -
          echo '74b3380fe50afc6d21d3fea8ade4ab442c6fa19050e5b9949c86e185645ec2b9  requirements.txt' | sha256sum -c -
          grep -q 'MGC Languages v5.7.1' RELEASE_VERIFICATION_v5.7.1.txt
          grep -q 'c57d0a31f570' RELEASE_VERIFICATION_v5.7.1.txt

      - name: Import baseline without touching workflow files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/' \
            /tmp/mgc-v571/ ./
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: import MGC Languages v5.7.1 baseline'
          git push origin HEAD:main
