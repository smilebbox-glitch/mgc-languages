name: Patch bootstrap exact part list

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/patch-bootstrap.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact numbered payload reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/bootstrap-import.yml')
          lines = p.read_text().splitlines()
          target = 'cat .bootstrap/p.part* | base64 --decode > /tmp/mgc-v571.tar.xz'
          out = []
          replaced = False
          for line in lines:
              if line.strip() == target:
                  indent = line[:len(line)-len(line.lstrip())]
                  out.append(indent + ': > /tmp/payload.b64')
                  out.append(indent + 'for i in $(seq 0 23); do')
                  out.append(indent + '  printf -v idx \'%03d\' "$i"')
                  out.append(indent + '  cat ".bootstrap/p.part${idx}" >> /tmp/payload.b64')
                  out.append(indent + 'done')
                  out.append(indent + 'base64 --decode /tmp/payload.b64 > /tmp/mgc-v571.tar.xz')
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('target reconstruction line not found')
          p.write_text('\n'.join(out) + '\n')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/bootstrap-import.yml
          git commit -m 'fix: reconstruct only numbered payload chunks'
          git push origin HEAD:main
