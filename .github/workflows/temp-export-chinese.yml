name: temp-export-chinese-corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-export-chinese.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export compact Chinese corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('data/chinese.json')
          items = json.loads(src.read_text(encoding='utf-8'))['items']
          compact = [
              {
                  'id': row['id'],
                  'category': row.get('category', ''),
                  'subcategory': row.get('subcategory', ''),
                  'ru': row.get('ru', ''),
                  'level': row.get('level', 'B1'),
              }
              for row in items
          ]
          out = Path('.tmp_export/compact')
          out.mkdir(parents=True, exist_ok=True)
          chunk_size = 350
          for old in out.glob('chunk_*.json'):
              old.unlink()
          for index in range(0, len(compact), chunk_size):
              chunk = compact[index:index + chunk_size]
              path = out / f'chunk_{index // chunk_size + 1:02d}.json'
              path.write_text(json.dumps({'items': chunk}, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps({'count': len(compact), 'chunk_size': chunk_size, 'chunks': (len(compact)+chunk_size-1)//chunk_size}, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Commit temporary compact export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_export/compact
          git commit -m "chore: export compact Chinese corpus for parity work [skip ci]"
          git push
