name: mgc-languages-ci

on:
  push:
  pull_request:

concurrency:
  group: mgc-languages-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Existing static preflight
        run: bash scripts/static_preflight.sh
      - name: Extended language content contracts
        run: python tests/content_contract.py

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [base, pronunciation, putonghua, reliability, ops, v57, v571, v572, v573, v574, v575, v576, v577, v578, v579, v580, v581, v582, v583]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression shard — ${{ matrix.shard }}
        run: python scripts/run_release_tests.py --shard "${{ matrix.shard }}" --timeout 75

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static, regression]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mgc-languages:ci .
      - name: Verify modular entrypoint, system/observability/auth/learning routers, security/governance/learning/services/workflows/auth bindings and offline TTS in image
        run: docker run --rm --entrypoint python mgc-languages:ci -c "import shutil, asgi; assert asgi.app; assert asgi.CONTRACT_REPORT.ok; assert asgi.ROUTER_BINDING_REPORT.ok; assert asgi.ROUTER_BINDING_REPORT.system_route_count == 5; assert asgi.ROUTER_BINDING_REPORT.root_mount_order_preserved; assert asgi.ROUTER_BINDING_REPORT.router_module_owned; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.ok; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.metrics_route_bound; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.root_mount_order_preserved; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.renderer_module_owned; assert asgi.SECURITY_BINDING_REPORT.ok; assert asgi.GOVERNANCE_BINDING_REPORT.ok; assert asgi.GOVERNANCE_BINDING_REPORT.rls_bound; assert asgi.GOVERNANCE_BINDING_REPORT.audit_event_bound; assert asgi.LEARNING_BINDING_REPORT.ok; assert asgi.LEARNING_BINDING_REPORT.xp_profile_bound; assert asgi.LEARNING_BINDING_REPORT.xp_award_bound; assert asgi.LEARNING_BINDING_REPORT.srs_schedule_bound; assert asgi.SERVICE_BINDING_REPORT.ok; assert asgi.SERVICE_BINDING_REPORT.user_view_bound; assert asgi.SERVICE_BINDING_REPORT.terms_query_bound; assert asgi.SERVICE_BINDING_REPORT.revision_bound; assert asgi.WORKFLOW_BINDING_REPORT.ok; assert asgi.WORKFLOW_BINDING_REPORT.practice_route_bound; assert asgi.WORKFLOW_BINDING_REPORT.game_start_route_bound; assert asgi.WORKFLOW_BINDING_REPORT.game_finish_route_bound; assert asgi.WORKFLOW_BINDING_REPORT.question_attempt_route_bound; assert asgi.WORKFLOW_BINDING_REPORT.learning_service_captured; assert asgi.WORKFLOW_BINDING_REPORT.terminology_service_captured; assert asgi.AUTH_BINDING_REPORT.ok; assert asgi.AUTH_BINDING_REPORT.current_user_dependency_occurrences > 0; assert asgi.AUTH_BINDING_REPORT.role_dependency_overrides > 0; assert asgi.AUTH_ROUTER_BINDING_REPORT.ok; assert asgi.AUTH_ROUTER_BINDING_REPORT.auth_route_count == 6; assert asgi.AUTH_ROUTER_BINDING_REPORT.local_route_count == 4; assert asgi.AUTH_ROUTER_BINDING_REPORT.oidc_route_count == 2; assert asgi.AUTH_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.AUTH_ROUTER_BINDING_REPORT.current_user_dependency_is_extracted; assert asgi.AUTH_ROUTER_BINDING_REPORT.session_factory_is_extracted; assert asgi.LEARNING_ROUTER_BINDING_REPORT.ok; assert asgi.LEARNING_ROUTER_BINDING_REPORT.learning_route_count == 12; assert asgi.LEARNING_ROUTER_BINDING_REPORT.progress_route_count == 2; assert asgi.LEARNING_ROUTER_BINDING_REPORT.course_route_count == 2; assert asgi.LEARNING_ROUTER_BINDING_REPORT.review_route_count == 2; assert asgi.LEARNING_ROUTER_BINDING_REPORT.gamification_route_count == 4; assert asgi.LEARNING_ROUTER_BINDING_REPORT.preferences_route_count == 2; assert asgi.LEARNING_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.LEARNING_ROUTER_BINDING_REPORT.auth_core_bound; assert asgi.LEARNING_ROUTER_BINDING_REPORT.learning_core_bound; assert asgi.LEARNING_ROUTER_BINDING_REPORT.terminology_service_bound; assert shutil.which('espeak-ng')"
      - name: Start application container
        run: |
          docker run -d --name mgc-languages-ci \
            -p 8000:8000 \
            -e APP_ENV=development \
            -e AUTH_MODE=local \
            -e AUTO_CREATE_SCHEMA=true \
            -e DATABASE_URL=sqlite:////tmp/mgc-languages-ci.db \
            -e OIDC_STATE_SECRET=ci-runtime-state-secret-32-bytes \
            -e TTS_CACHE_PERSISTENCE=ephemeral \
            mgc-languages:ci
      - name: Run automated runtime smoke
        env:
          BASE_URL: http://127.0.0.1:8000
          SMOKE_STARTUP_TIMEOUT_SECONDS: '60'
        run: python tests/runtime_smoke.py
      - name: Capture runtime diagnostics
        if: failure()
        run: |
          docker inspect mgc-languages-ci > docker-inspect.json 2>&1 || true
          docker logs mgc-languages-ci > docker-runtime.log 2>&1 || true
          cat docker-runtime.log || true
      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mgc-languages-runtime-diagnostics
          path: |
            docker-inspect.json
            docker-runtime.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runtime container
        if: always()
        run: docker rm -f mgc-languages-ci || true
