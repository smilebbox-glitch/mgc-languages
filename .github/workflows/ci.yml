name: mgc-languages-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-languages-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Python compile
        run: python -m compileall -q app.py asgi.py mgc mgc_core scripts

      - name: API architecture contract
        run: python scripts/api_contract_guard.py

      - name: Current pilot regression guards
        run: |
          python tests/v616_frontend_physical_shell_cleanup_test.py
          python tests/v617_company_pilot_candidate_test.py

      - name: User-review UX regression
        run: python tests/v617_pilot_ux_regression_test.py

      - name: v6.0.18 vocabulary and games regression
        run: python tests/v618_content_games_regression_test.py

      - name: v6.0.19 Factory Journey regression
        run: python tests/v619_factory_journey_test.py

      - name: v6.0.20 adaptive arcade missions regression
        run: python tests/v620_arcade_missions_test.py

      - name: v6.0.20 arcade mastery regression
        run: python tests/v620_arcade_mastery_test.py

      - name: v6.0.21 production game depth regression
        run: python tests/v621_game_depth_test.py

      - name: v6.0.22 production decision chains regression
        run: python tests/v622_decision_chains_test.py

      - name: v6.0.23 dynamic factory scenarios regression
        run: python tests/v623_dynamic_factory_test.py

      - name: v6.0.24 shift simulation regression
        run: python tests/v624_shift_simulation_test.py

      - name: v6.0.25 personal shift analytics regression
        run: python tests/v625_shift_analytics_test.py

      - name: v6.0.26 team analytics and leaderboard regression
        run: python tests/v626_team_leaderboard_test.py

      - name: v6.0.27 adaptive training regression
        run: python tests/v627_adaptive_training_test.py

      - name: v6.0.28 UX performance regression
        run: python tests/v628_ux_performance_test.py

      - name: v6.0.29 release candidate freeze regression
        run: python tests/v629_release_candidate_test.py

      - name: v6.0.29 operability smoke contract
        run: python tests/v629_operability_smoke_test.py

      - name: Release candidate manifest guard
        run: python scripts/release_candidate_guard.py --json

      - name: JavaScript syntax
        run: |
          node --check static/frontend/pilot_home.js
          node --check static/frontend/pilot_ux_hardening.js
          node --check static/frontend/learning.js
          node --check static/frontend/game_lab_v618.js
          node --check static/frontend/game_engagement_v618.js
          node --check static/frontend/factory_journey_v619.js
          node --check static/frontend/arcade_missions_v620.js
          node --check static/frontend/arcade_mastery_v620.js
          node --check static/frontend/game_depth_v621.js
          node --check static/frontend/decision_chains_v622.js
          node --check static/frontend/dynamic_factory_v623.js
          node --check static/frontend/shift_simulation_v624.js
          node --check static/frontend/shift_analytics_v625.js
          node --check static/frontend/team_leaderboard_v626.js
          node --check static/frontend/adaptive_training_v627.js
          node --check static/frontend/ux_performance_v628.js
          node --check static/frontend/practice_games.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js

  lan-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Create disposable LAN pilot configuration
        shell: bash
        run: |
          DB_SECRET="$(openssl rand -hex 24)"
          ADMIN_SECRET="$(openssl rand -hex 24)"
          STATE_SECRET="$(openssl rand -hex 24)"
          METRICS_SECRET="$(openssl rand -hex 24)"
          {
            echo 'MGC_BIND_ADDRESS=127.0.0.1'
            echo 'MGC_PORT=18080'
            echo 'MGC_TRUSTED_HOSTS=localhost,127.0.0.1'
            echo 'POSTGRES_DB=mgc_languages'
            echo 'POSTGRES_USER=mgc_languages'
            echo "POSTGRES_PASSWORD=$DB_SECRET"
            echo 'MGC_ADMIN_USERNAME=admin'
            echo "MGC_ADMIN_PASSWORD=$ADMIN_SECRET"
            echo 'MGC_ADMIN_DISPLAY_NAME=MGC Admin'
            echo 'MGC_ADMIN_DEPARTMENT=Administration'
            echo 'MGC_ADMIN_SYNC_CREDENTIALS=true'
            echo "OIDC_STATE_SECRET=$STATE_SECRET"
            echo "METRICS_TOKEN=$METRICS_SECRET"
            echo 'REGISTRATION_ENABLED=true'
            echo 'SESSION_TTL_HOURS=168'
            echo 'WEB_CONCURRENCY=2'
            echo 'UVICORN_LIMIT_CONCURRENCY=200'
            echo 'UVICORN_BACKLOG=2048'
            echo 'UVICORN_KEEP_ALIVE_SECONDS=5'
            echo 'DB_POOL_SIZE=5'
            echo 'DB_MAX_OVERFLOW=5'
            echo 'DB_POOL_TIMEOUT=10'
            echo 'DB_POOL_RECYCLE=1800'
            echo 'POSTGRES_MAX_CONNECTIONS=120'
            echo 'DB_CONNECTION_RESERVE=20'
            echo 'CAPACITY_EXPECTED_AUX_CONNECTIONS=8'
            echo 'TTS_ENABLED=true'
            echo 'TTS_CONCURRENCY=2'
            echo 'CORS_ORIGINS='
          } > .env.ci-lan

      - name: Validate LAN compose model
        run: docker compose --env-file .env.ci-lan -f docker-compose.lan.yml config --quiet

      - name: Start exact LAN PostgreSQL stack
        run: docker compose --env-file .env.ci-lan -f docker-compose.lan.yml up -d --build

      - name: Wait for LAN readiness through Nginx
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/health/ready > /tmp/lan-ready.json; then
              cat /tmp/lan-ready.json
              exit 0
            fi
            if docker compose --env-file .env.ci-lan -f docker-compose.lan.yml ps --status exited --services | grep -qx app; then
              echo 'LAN app container exited before readiness.'
              docker compose --env-file .env.ci-lan -f docker-compose.lan.yml logs --no-color --tail 200 app || true
              exit 1
            fi
            sleep 2
          done
          echo 'LAN stack did not reach readiness in time.'
          exit 1

      - name: Verify HTTP operability through Nginx
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:18080/health/live > /tmp/lan-live.json
          curl -fsS http://127.0.0.1:18080/health/ready > /tmp/lan-ready.json
          curl -fsS http://127.0.0.1:18080/api/meta > /tmp/lan-meta.json
          curl -fsS http://127.0.0.1:18080/ > /tmp/lan-index.html
          grep -q '/frontend/boot.js' /tmp/lan-index.html
          curl -fsS http://127.0.0.1:18080/frontend/boot.js > /tmp/lan-boot.js
          grep -q "pilotCandidate: 'v6.0.29'" /tmp/lan-boot.js
          for asset in \
            /frontend/game_lab_v618.js \
            /frontend/shift_simulation_v624.js \
            /frontend/team_leaderboard_v626.js \
            /frontend/adaptive_training_v627.js \
            /frontend/ux_performance_v628.js; do
            curl -fsS "http://127.0.0.1:18080${asset}" > /dev/null
          done
          python - <<'PY'
          import json
          with open('/tmp/lan-meta.json', encoding='utf-8') as fh:
              meta = json.load(fh)
          assert meta.get("version") == "6.0.29", meta
          assert meta.get("title") == "MGC Languages", meta
          assert meta.get("environment") == "pilot", meta
          assert meta.get("chinese_learning_standard"), meta
          print(json.dumps({"version": meta["version"], "environment": meta["environment"]}, ensure_ascii=False))
          PY
          for endpoint in /api/adaptive-training/plan /api/manager/shift-analytics; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080${endpoint}")"
            case "$status" in
              401|403) ;;
              *) echo "Protected endpoint ${endpoint} returned ${status}"; exit 1 ;;
            esac
          done

      - name: Verify LAN services and modular runtime
        run: |
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml ps
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T app python -c "import asgi, mgc_core.runtime as r; assert asgi.app; assert asgi.CONTRACT_REPORT.ok; assert r.SHIFT_ANALYTICS_ROUTER_BINDING_REPORT.ok; assert r.TEAM_ANALYTICS_ROUTER_BINDING_REPORT.ok; assert r.ADAPTIVE_TRAINING_ROUTER_BINDING_REPORT.ok; assert r._legacy_module.V618_CONTENT_STATUS['parity']; assert len(r._legacy_module.TERMS['chinese']) == len(r._legacy_module.TERMS['english'])"
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T app python scripts/release_candidate_guard.py --json
          cat /tmp/lan-meta.json

      - name: LAN runtime diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml ps -a || true
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml logs --no-color --tail 250 app db nginx || true

      - name: Stop disposable LAN stack
        if: always()
        run: docker compose --env-file .env.ci-lan -f docker-compose.lan.yml down -v --remove-orphans || true
