name: mgc-languages-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-languages-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Python compile
        run: python -m compileall -q app.py asgi.py mgc mgc_core scripts

      - name: API architecture contract
        run: python scripts/api_contract_guard.py

      - name: Current pilot regression guards
        run: |
          python tests/v616_frontend_physical_shell_cleanup_test.py
          python tests/v617_company_pilot_candidate_test.py

      - name: JavaScript syntax
        run: |
          node --check static/frontend/pilot_home.js
          node --check static/frontend/learning.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Build current pilot image
        run: docker build -t mgc-languages:ci .

      - name: Start current pilot container
        run: |
          docker run -d --name mgc-languages-ci \
            -p 8000:8000 \
            -e APP_ENV=development \
            -e AUTH_MODE=local \
            -e AUTO_CREATE_SCHEMA=true \
            -e DATABASE_URL=sqlite:////tmp/mgc-languages-ci.db \
            -e OIDC_STATE_SECRET=ci-runtime-state-secret-32-bytes \
            -e TTS_CACHE_PERSISTENCE=ephemeral \
            mgc-languages:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx 'mgc-languages-ci'; then
              docker logs mgc-languages-ci || true
              exit 1
            fi
            sleep 2
          done
          docker logs mgc-languages-ci || true
          exit 1

      - name: Verify modular runtime in image
        run: docker exec mgc-languages-ci python -c "import asgi; assert asgi.app; assert asgi.CONTRACT_REPORT.ok"

      - name: Runtime diagnostics
        if: failure()
        run: |
          docker inspect mgc-languages-ci || true
          docker logs mgc-languages-ci || true

      - name: Stop runtime container
        if: always()
        run: docker rm -f mgc-languages-ci || true
