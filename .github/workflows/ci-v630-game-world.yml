name: mgc-languages-v630-game-world

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v630-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v630-game-world-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: v6.0.29 archived compatibility
        run: |
          python tests/v629_release_candidate_test.py
          python tests/v629_operability_smoke_test.py

      - name: v6.0.30 Game World regression
        shell: bash
        run: |
          set -o pipefail
          python tests/v630_game_world_test.py 2>&1 | tee /tmp/v630-game-world-test.log

      - name: v6.0.30 Factory Journey 2.0 regression
        shell: bash
        run: |
          set -o pipefail
          python tests/v630_factory_journey_v2_test.py 2>&1 | tee /tmp/v630-factory-journey-v2-test.log

      - name: v6.0.30 Chinese games localization
        run: python tests/v630_chinese_games_localization_test.py

      - name: v6.0.30 Chinese learning surface and level uniqueness
        run: python tests/v630_chinese_learning_surface_test.py

      - name: Upload Game World regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v630-game-world-regression-log
          path: |
            /tmp/v630-game-world-test.log
            /tmp/v630-factory-journey-v2-test.log
          if-no-files-found: warn
          retention-days: 3

      - name: Current release guard
        run: python scripts/release_candidate_guard.py --json

      - name: PWA security isolation
        run: python tests/pwa_security_test.py

      - name: JavaScript syntax
        run: |
          node --check static/frontend/game_world_v630.js
          node --check static/frontend/game_world_stage_a_v630.js
          node --check static/frontend/game_world_stage_b_v630.js
          node --check static/frontend/game_world_stage_c_v630.js
          node --check static/frontend/game_world_stage_d_v630.js
          node --check static/frontend/game_world_stage_d_i18n_v630.js
          node --check static/frontend/factory_journey_v2_v630.js
          node --check static/frontend/game_chinese_localization_v630.js
          node --check static/frontend/chinese_learning_surface_v630.js
          node --check static/frontend/boot.js
          node --check static/service-worker.js
          node --check static/pwa-register.js

      - name: v6.0.30 release identity
        run: |
          grep -q '"release": "6.0.30"' RELEASE_MANIFEST_v6.0.30.json
          grep -q '"status": "game-world-expansion"' RELEASE_MANIFEST_v6.0.30.json
          grep -q '"stage_a"' RELEASE_MANIFEST_v6.0.30.json
          grep -q '"stage_b"' RELEASE_MANIFEST_v6.0.30.json
          grep -q '"stage_c"' RELEASE_MANIFEST_v6.0.30.json
          grep -q '"stage_d"' RELEASE_MANIFEST_v6.0.30.json
          grep -q '"stage_e"' RELEASE_MANIFEST_v6.0.30.json
          grep -q '"chinese_localization"' RELEASE_MANIFEST_v6.0.30.json
          grep -q 'game_world_stage_a_v630.css' static/index.html
          grep -q 'game_world_stage_a_v630.js' static/index.html
          grep -q 'game_world_stage_b_v630.css' static/index.html
          grep -q 'game_world_stage_b_v630.js' static/index.html
          grep -q 'game_world_stage_c_v630.css' static/index.html
          grep -q 'game_world_stage_c_v630.js' static/index.html
          grep -q 'game_world_stage_d_v630.css' static/index.html
          grep -q 'game_world_stage_d_v630.js' static/index.html
          grep -q 'game_world_stage_d_i18n_v630.js' static/index.html
          grep -q 'factory_journey_v2_v630.css' static/index.html
          grep -q 'factory_journey_v2_v630.js' static/index.html
          grep -q 'game_chinese_localization_v630.js' static/index.html
          grep -q 'chinese_learning_surface_v630.js' static/index.html
          grep -q "pilotCandidate: 'v6.0.30'" static/frontend/boot.js
          grep -q 'APP_VERSION = os.getenv("APP_VERSION", "6.0.30")' mgc/config.py
          grep -q 'Release: v6.0.30' BUILD_INFO_v6.0.30.txt
          grep -q 'Game World Expansion' CHANGELOG_v6.0.30.md
          grep -q 'Stage D — Process-Specific Motion' CHANGELOG_v6.0.30.md
          grep -q 'Stage E — Factory Journey 2.0' CHANGELOG_v6.0.30.md
          grep -q 'Chinese Game Localization Audit' CHANGELOG_v6.0.30.md
