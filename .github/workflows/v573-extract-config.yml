name: v5.7.3 safe database extraction

on:
  push:
    branches: [refactor/v5.7.3-config-bootstrap]
    paths:
      - '.github/workflows/v573-extract-config.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v5.7.3-config-bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract database bootstrap without behavior changes
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.py')
          source = app_path.read_text(encoding='utf-8')
          start_marker = 'if DATABASE_URL.startswith("postgres://"):\n'
          end_marker = 'SessionLocal = sessionmaker(bind=engine, expire_on_commit=False)\n'
          start = source.index(start_marker)
          end = source.index(end_marker) + len(end_marker)

          replacement = (
              '# v5.7.3: database engine/session bootstrap extracted from the API module.\n'
              'from mgc.database import DATABASE_URL, SessionLocal, engine  # noqa: E402\n'
          )
          app_path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          compile(Path('mgc/database.py').read_text(encoding='utf-8'), 'mgc/database.py', 'exec')
          compile(app_path.read_text(encoding='utf-8'), 'app.py', 'exec')
          PY
      - name: Commit database bootstrap extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py mgc/database.py
          git diff --cached --check
          git commit -m 'refactor: extract database engine and session bootstrap'
          git push origin HEAD:refactor/v5.7.3-config-bootstrap
